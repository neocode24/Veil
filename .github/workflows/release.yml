name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: cd Veil && xcodegen generate

      - name: Build
        run: |
          xcodebuild \
            -project Veil/Veil.xcodeproj \
            -scheme Veil \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            ENABLE_HARDENED_RUNTIME=NO \
            build

      - name: Package
        run: |
          mkdir -p build/dist
          APP_PATH=$(find build/DerivedData -name 'Veil.app' -path '*/Release/*' | head -1)
          cp -R "$APP_PATH" build/dist/Veil.app
          cd build/dist && zip -r Veil-${{ github.ref_name }}.zip Veil.app

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/dist/Veil-${{ github.ref_name }}.zip
          generate_release_notes: true

      - name: Generate Sparkle appcast
        id: appcast
        env:
          SPARKLE_EDDSA_PRIVATE_KEY: ${{ secrets.SPARKLE_EDDSA_PRIVATE_KEY }}
        run: |
          if [ -z "$SPARKLE_EDDSA_PRIVATE_KEY" ]; then
            echo "::warning::SPARKLE_EDDSA_PRIVATE_KEY secret not set. Skipping appcast generation."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          SPARKLE_VERSION="2.6.4"
          mkdir -p sparkle-tools && cd sparkle-tools
          curl -sL "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz" -o Sparkle.tar.xz
          tar xf Sparkle.tar.xz

          mkdir -p ../appcast_output
          cp ../build/dist/Veil-${{ github.ref_name }}.zip ../appcast_output/

          echo "$SPARKLE_EDDSA_PRIVATE_KEY" > /tmp/eddsa_key.pem
          ./bin/generate_appcast \
            --ed-key-file /tmp/eddsa_key.pem \
            --link-url-prefix "https://github.com/neocode24/Veil/releases/download/${{ github.ref_name }}/" \
            ../appcast_output/
          rm -f /tmp/eddsa_key.pem

      - name: Deploy appcast to GitHub Pages
        if: steps.appcast.outputs.skip != 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./appcast_output
          publish_branch: gh-pages
          keep_files: true

      - name: Update Homebrew Tap
        env:
          HOMEBREW_DEPLOY_KEY: ${{ secrets.HOMEBREW_DEPLOY_KEY }}
        run: |
          if [ -z "$HOMEBREW_DEPLOY_KEY" ]; then
            echo "::warning::HOMEBREW_DEPLOY_KEY secret not set. Skipping tap update."
            exit 0
          fi

          mkdir -p ~/.ssh
          echo "$HOMEBREW_DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null

          VERSION="${{ github.ref_name }}"
          VERSION_NO_V="${VERSION#v}"
          ZIP_FILE="Veil-${VERSION}.zip"

          curl -sL "https://github.com/neocode24/Veil/releases/download/${VERSION}/${ZIP_FILE}" -o "${ZIP_FILE}"
          SHA256=$(shasum -a 256 "${ZIP_FILE}" | cut -d ' ' -f 1)

          GIT_SSH_COMMAND="ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes" \
            git clone git@github.com:neocode24/homebrew-tap.git homebrew-tap
          cd homebrew-tap

          cat > "Casks/veil.rb" << CASK_EOF
          cask "veil" do
            version "${VERSION_NO_V}"
            sha256 "${SHA256}"

            url "https://github.com/neocode24/Veil/releases/download/v#{version}/Veil-v#{version}.zip"
            name "Veil"
            desc "macOS menu bar app that softly blanks other monitors when fullscreen video is detected"
            homepage "https://github.com/neocode24/Veil"

            depends_on macos: ">= :sonoma"

            app "Veil.app"

            zap trash: [
              "~/Library/Preferences/com.neocode24.Veil.plist",
              "~/Library/Caches/com.neocode24.Veil",
            ]
          end
          CASK_EOF

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/veil.rb
          git diff --cached --quiet || git commit -m "chore: update veil to ${VERSION_NO_V}"
          GIT_SSH_COMMAND="ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes" git push

          rm -f ~/.ssh/deploy_key
